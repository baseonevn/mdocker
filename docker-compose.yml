version: "3.4"
services:
  mage:
    image: mage-dev
    build:
      context: ./
      dockerfile: ./.docker/dev/Dockerfile
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    working_dir: /public_html
    volumes:
      - .:/public_html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PHP_IDE_CONFIG: "serverName=Mage2.local"
      XDEBUG_ENABLE: true
    env_file:
      - .env
    depends_on:
      - database
  database:
    image: mysql:8
    environment:
      - COMPOSE_INTERACTIVE_NO_CLI=1
      - MYSQL_ROOT_PASSWORD=${DATABASE_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DATABASE}
      - MYSQL_USER=${DATABASE_USER}
      - MYSQL_PASSWORD=${DATABASE_PASSWORD}
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
    command: mysqld --character-set-server=utf8 --collation-server=utf8_unicode_ci  --default-authentication-plugin=mysql_native_password
    volumes:
      - ./.docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:rw
      - ./.docker/mysql/01_entry_init_db.sh:/docker-entrypoint-initdb.d/01_entry_init_db.sh
      - ./.docker/db:/docker-entrypoint-initdb-multi.d
    cap_add:
      - SYS_NICE
    tty: true
    stdin_open: true
  nginx:
    image: "nginx:latest"
    working_dir: /public_html
    volumes:
      - .:/public_html
      - ./.docker/settings/site/default.conf.template:/etc/nginx/conf.d/default.conf.template:rw
      - ./.docker/settings/site/mage2.conf:/etc/nginx/setting/mage2.conf
      - ./.docker/logs/nginx:/var/log/nginx
    command: /bin/bash -c "envsubst \"`env | awk -F = '{printf \" $$%s\", $$1}'`\" < /etc/nginx/conf.d/default.conf.template > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"
    environment:
      - MAGE_MODE=developer
    depends_on:
      - mage
    links:
      - "mage:fpm"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mage.service=mage"
      - "traefik.http.routers.mage.rule=Host(`mage.base`)"
      - "traefik.http.routers.mage.entrypoints=websecure"
      - "traefik.http.services.mage.loadbalancer.server.port=9000"
      - "traefik.http.routers.mage.tls=true"
    networks:
      - proxy
      - default
  redis:
    image: redis
    working_dir: /data
    command: ["redis-server", "--appendonly", "yes"]
    hostname: redis
  elasticsearch:
    image: "elastic/elasticsearch:7.17.7"
    environment:
      ES_JAVA_OPTS: "${ES_JAVA_OPTS:--Xms512m -Xmx512m}"
      discovery.type: "single-node"
networks:
  db:
    name: db
    external: true
  proxy:
    name: proxy
    external: true
